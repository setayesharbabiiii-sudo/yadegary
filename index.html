
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدرسه یادگاری</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: #f5f3ff;
      color: #302c46;
    }

    header {
      background: linear-gradient(135deg, #7867c8, #b19ce8);
      color: white;
      text-align: center;
      padding: 32px 15px;
      border-radius: 0 0 28px 28px;
    }

    header h1 { margin: 0 0 10px; }
    header p { margin: 0; }

    main {
      max-width: 650px;
      margin: 22px auto;
      padding: 0 15px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
    }

    .menu button {
      padding: 22px 8px;
      background: white;
      border-radius: 18px;
      color: #51427e;
      font-size: 16px;
      box-shadow: 0 4px 14px #302c4610;
    }

    .menu button:active { background: #e9e1ff; }

    #content {
      margin-top: 20px;
      background: white;
      border-radius: 20px;
      padding: 20px;
      min-height: 100px;
      box-shadow: 0 4px 14px #302c4610;
    }

    h2 { color: #7867c8; font-size: 21px; }

    .item {
      display: block;
      width: 100%;
      text-align: right;
      background: #f5f2ff;
      padding: 14px;
      border-radius: 12px;
      margin: 9px 0;
      color: #40345f;
      font-size: 15px;
    }

    .item:hover { background: #e9e1ff; }

    .back {
      color: #7867c8;
      background: transparent;
      padding: 8px 0;
      font-size: 14px;
    }

    .detail {
      background: #f5f2ff;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
      line-height: 2;
    }

    footer {
      text-align: center;
      color: #827b98;
      font-size: 12px;
      padding: 25px 10px;
    }
  </style>
</head>
<body>

<header>
  <h1>🏫 مدرسه یادگاری</h1>
  <p>خاطرات قشنگ ما، برای همیشه 💜</p>
</header>

<main>
  <div class="menu" id="menu">
    <button onclick="showSection('students')">👩🏻‍🎓<br><br>دانش‌آموزان</button>
    <button onclick="showSection('teachers')">👩🏻‍🏫<br><br>دبیران</button>
    <button onclick="showSection('lessons')">📚<br><br>درس‌ها</button>
    <button onclick="showSection('schedule')">🗓️<br><br>برنامه هفتگی</button>
  </div>

  <section id="content">
    <h2>به مدرسه یادگاری خوش اومدی! 💜</h2>
    <p>یکی از بخش‌های بالا رو انتخاب کن.</p>
  </section>
</main>

<footer>ساخته‌شده با عشق برای مدرسه یادگاری 💜</footer>

<script>
  const students = [
    "ستایش",
    "نازنین"
  ];

  const teachers = [
    "نام دبیر اول",
    "نام دبیر دوم"
  ];

  const lessons = [
    { name: "ریاضی", teacher: "نام دبیر ریاضی" },
    { name: "فیزیک", teacher: "نام دبیر فیزیک" },
    { name: "شیمی", teacher: "نام دبیر شیمی" },
    { name: "فارسی", teacher: "نام دبیر فارسی" },
    { name: "عربی", teacher: "نام دبیر عربی" },
    { name: "دین و زندگی", teacher: "نام دبیر دین و زندگی" },
    { name: "هندسه", teacher: "نام دبیر هندسه" }
  ];

  const content = document.getElementById("content");

  function showSection(section) {
    if (section === "students") {
      showList("👩🏻‍🎓 دانش‌آموزان", students);
    } else if (section === "teachers") {
      showList("👩🏻‍🏫 دبیران", teachers);
    } else if (section === "lessons") {
      content.innerHTML = `
        <button class="back" onclick="goHome()">← بازگشت به صفحه اصلی</button>
        <h2>📚 درس‌ها</h2>
        <p>برای دیدن اسم دبیر، روی درس موردنظرت بزن.</p>
        <div id="lessonList"></div>
      `;

      const list = document.getElementById("lessonList");

      lessons.forEach((lesson, index) => {
        const button = document.createElement("button");
        button.className = "item";
        button.textContent = "📖 " + lesson.name + " ←";
        button.onclick = () => showTeacher(index);
        list.appendChild(button);
      });
    } else if (section === "schedule") {
      content.innerHTML = `
        <button class="back" onclick="goHome()">← بازگشت به صفحه اصلی</button>
        <h2>🗓️ برنامه هفتگی</h2>
        <p>برنامه هفتگی کلاس‌ها به‌زودی اینجا قرار می‌گیره.</p>
      `;
    }
  }

  function showList(title, items) {
    content.innerHTML = `
      <button class="back" onclick="goHome()">← بازگشت به صفحه اصلی</button>
      <h2>${title}</h2>
      <div id="peopleList"></div>
    `;

    const list = document.getElementById("peopleList");

    items.forEach(name => {
      const item = document.createElement("div");
      item.className = "item";
      item.textContent = "👤 " + name;
      list.appendChild(item);
    });
  }

  function showTeacher(index) {
    const lesson = lessons[index];

    content.innerHTML = `
      <button class="back" onclick="showSection('lessons')">← بازگشت به درس‌ها</button>
      <h2>📚 ${lesson.name}</h2>
      <div class="detail">
        👩🏻‍🏫 دبیر این درس:<br>
        <strong></strong>
      </div>
    `;

    content.querySelector(".detail strong").textContent = lesson.teacher;
  }

  function goHome() {
    content.innerHTML = `
      <h2>به مدرسه یادگاری خوش اومدی! 💜</h2>
      <p>یکی از بخش‌های بالا رو انتخاب کن.</p>
    `;
  }
</script>

</body>
</html>
