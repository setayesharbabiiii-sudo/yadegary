
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسه یادگاری</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Tahoma, sans-serif;
  background: #f5f1ff;
  color: #352d4d;
}

button, input { font-family: inherit; }
button { cursor: pointer; }

#welcome {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 22px;
  background: linear-gradient(145deg, #e9e0ff, #faf7ff, #e5ddff);
}

.welcome-box {
  width: 100%;
  max-width: 420px;
  text-align: center;
  padding: 38px 24px;
  background: white;
  border: 1px solid #e8defe;
  border-radius: 30px;
  box-shadow: 0 15px 45px #7560ad22;
}

.welcome-icon { font-size: 65px; }

.welcome-box h1 {
  font-size: 25px;
  color: #7863bd;
  line-height: 1.9;
}

.welcome-box p {
  font-size: 14px;
  color: #777087;
  line-height: 2.2;
  margin-bottom: 28px;
}

.primary {
  display: block;
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 15px;
  color: white;
  background: linear-gradient(120deg, #7864bd, #a18bdf);
  font-size: 16px;
}

header {
  text-align: center;
  padding: 27px 12px;
  color: white;
  background: linear-gradient(135deg, #7763bb, #b6a1e7);
  border-radius: 0 0 25px 25px;
}

header h1 { margin: 0 0 10px; }
header p { margin: 0; }

main {
  max-width: 700px;
  margin: 20px auto;
  padding: 0 14px;
}

.menu {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.menu button {
  padding: 22px 8px;
  border: 1px solid #e9e1f8;
  border-radius: 18px;
  background: white;
  color: #554580;
  font-size: 15px;
  box-shadow: 0 4px 14px #51427e0b;
}

#content {
  background: white;
  border-radius: 20px;
  padding: 19px;
  margin-top: 18px;
  min-height: 120px;
  box-shadow: 0 4px 14px #51427e0b;
  overflow-wrap: anywhere;
}

h2 { color: #7866bd; font-size: 20px; }

.item {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 9px 0;
  text-align: right;
  border: 0;
  border-radius: 12px;
  background: #f5f1ff;
  color: #40345f;
  font-size: 14px;
  line-height: 1.9;
}

.item:hover, .menu button:hover { background: #eae2ff; }

.back {
  border: 0;
  background: transparent;
  color: #7866bd;
  padding: 8px 0;
  font-size: 14px;
}

.detail {
  padding: 16px;
  border-radius: 14px;
  background: #f5f1ff;
  line-height: 2.2;
  margin-top: 12px;
}

input {
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border: 1px solid #dcd1f2;
  border-radius: 12px;
  font-size: 16px;
}

.error {
  color: #b33d57;
  font-size: 13px;
  line-height: 2;
}

.note {
  color: #777087;
  font-size: 12px;
  line-height: 2;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin-top: 15px;
}

th, td {
  border: 1px solid #e5def5;
  padding: 10px 5px;
  text-align: center;
  line-height: 1.9;
}

th { background: #eee7ff; color: #51427e; }
tr:nth-child(even) { background: #faf8ff; }

footer {
  text-align: center;
  color: #827a98;
  font-size: 12px;
  padding: 22px 8px;
}

[hidden] { display: none !important; }
</style>
</head>

<body>

<!-- صفحه اول -->
<section id="welcome">
  <div class="welcome-box">
    <div class="welcome-icon">🏫💜</div>
    <h1>به مدرسه یادگاری خوش آمدی!</h1>
    <p>
      به خانه خاطره‌های قشنگمون خوش اومدی.
      <br>
      اینجا قراره یادگاری‌هامون برای همیشه بمونن ✨
    </p>
    <button class="primary" onclick="enterSchool()">
      ورود به مدرسه 💜
    </button>
  </div>
</section>

<!-- محتوای مدرسه؛ ابتدا مخفی است -->
<div id="school" hidden>
  <header>
    <h1>🏫 مدرسه یادگاری</h1>
    <p>خاطرات قشنگ ما، برای همیشه 💜</p>
  </header>

  <main>
    <div class="menu">
      <button onclick="showSection('students')">
        🔒 👩🏻‍🎓<br><br>دانش‌آموزان
      </button>
      <button onclick="showSection('teachers')">
        👩🏻‍🏫<br><br>دبیران
      </button>
      <button onclick="showSection('lessons')">
        📚<br><br>درس‌ها
      </button>
      <button onclick="showSection('schedule')">
        🗓️<br><br>برنامه کلاسی
      </button>
    </div>

    <section id="content" aria-live="polite">
      <h2>خوش اومدی! 💜</h2>
      <p>یکی از بخش‌های مدرسه رو انتخاب کن.</p>
    </section>
  </main>

  <footer>مدرسه یادگاری 💜</footer>
</div>

<script>
const PASSWORD = "1389";

const students = [
  "ستایش", "نازنین", "نیایش", "ناسیه", "فاطمه",
  "حسنی", "هستی", "حوریه", "الیسا", "اندیا"
];

const lessons = [
  { name: "حسابان", teacher: "خانم حیدری" },
  { name: "آمار و احتمال", teacher: "خانم حیدری" },
  { name: "هندسه", teacher: "خانم حیدری" },
  { name: "ادبیات", teacher: "خانم نوروزی" },
  { name: "نگارش", teacher: "خانم نوروزی" },
  { name: "زمین‌شناسی", teacher: "خانم یادگارفرد" },
  { name: "تاریخ", teacher: "خانم یادگارفرد" },
  { name: "انسان و محیط زیست", teacher: "خانم یادگارفرد" },
  { name: "فیزیک", teacher: "خانم فاطمی" },
  { name: "زبان", teacher: "نامشخص" },
  { name: "شیمی", teacher: "نامشخص" },
  { name: "دین و زندگی", teacher: "نامشخص" },
  { name: "کار و هنر", teacher: "خانم دهقان" },
  { name: "عربی", teacher: "خانم دهقان" },
  { name: "ورزش", teacher: "نامشخص" }
];

const schedule = [
  { day: "شنبه", classes: ["عربی", "شیمی", "دین و زندگی"] },
  { day: "یکشنبه", classes: ["فیزیک", "حسابان", "تاریخ", "هندسه"] },
  { day: "دوشنبه", classes: ["آمار و احتمال", "زبان یا شیمی", "زمین‌شناسی", "کار و هنر"] },
  { day: "سه‌شنبه", classes: ["انسان و محیط زیست", "نگارش", "زبان", "ادبیات"] },
  { day: "چهارشنبه", classes: ["ورزش", "فیزیک", "حسابان"] }
];

const content = document.getElementById("content");

function enterSchool() {
  document.getElementById("welcome").hidden = true;
  document.getElementById("school").hidden = false;
  window.scrollTo(0, 0);
}

function makeButton(text, action) {
  const button = document.createElement("button");
  button.className = "item";
  button.textContent = text;
  button.onclick = action;
  return button;
}

function addBack(action) {
  const button = document.createElement("button");
  button.className = "back";
  button.textContent = "← بازگشت";
  button.onclick = action;
  content.appendChild(button);
}

function goHome() {
  content.replaceChildren();

  const title = document.createElement("h2");
  title.textContent = "خوش اومدی! 💜";

  const text = document.createElement("p");
  text.textContent = "یکی از بخش‌های مدرسه رو انتخاب کن.";

  content.append(title, text);
}

function showSection(section) {
  if (section === "students") return showLock();
  if (section === "teachers") return showTeachers();
  if (section === "lessons") return showLessons();
  if (section === "schedule") return showSchedule();
}

function showLock() {
  content.replaceChildren();
  addBack(goHome);

  const title = document.createElement("h2");
  title.textContent = "🔒 ورود به بخش دانش‌آموزان";

  const text = document.createElement("p");
  text.textContent = "رمز ورود را وارد کن.";

  const form = document.createElement("form");
  const input = document.createElement("input");
  input.type = "password";
  input.placeholder = "رمز ورود";
  input.autocomplete = "off";
  input.required = true;
  input.setAttribute("aria-label", "رمز ورود");

  const button = document.createElement("button");
  button.className = "primary";
  button.textContent = "ورود";

  const error = document.createElement("p");
  error.className = "error";

  form.append(input, button);
  form.onsubmit = function(event) {
    event.preventDefault();

    if (input.value === PASSWORD) {
      showStudents();
    } else {
      error.textContent = "رمز اشتباه است؛ دوباره امتحان کن.";
      input.value = "";
      input.focus();
    }
  };

  content.append(title, text, form, error);
}

function showStudents() {
  content.replaceChildren();
  addBack(goHome);

  const title = document.createElement("h2");
  title.textContent = "👩🏻‍🎓 دانش‌آموزان";
  content.appendChild(title);

  students.forEach((student, index) => {
    content.appendChild(makeButton(
      (index + 1) + ". " + student,
      function() { showStudentDetail(student); }
    ));
  });
}

function showStudentDetail(student) {
  content.replaceChildren();
  addBack(showStudents);

  const title = document.createElement("h2");
  title.textContent = "اطلاعات دانش‌آموز";

  const detail = document.createElement("div");
  detail.className = "detail";
  detail.textContent = "نام: " + student;

  content.append(title, detail);
}

function showTeachers() {
  content.replaceChildren();
  addBack(goHome);

  const title = document.createElement("h2");
  title.textContent = "👩🏻‍🏫 دبیران";
  content.appendChild(title);

  const names = [...new Set(lessons.map(item => item.teacher))];

  names.forEach(name => {
    const subjects = lessons
      .filter(item => item.teacher === name)
      .map(item => item.name);

    content.appendChild(makeButton("👩🏻‍🏫 " + name, function() {
      showTeacherDetail(name, subjects);
    }));
  });

  const note = document.createElement("p");
  note.className = "note";
  note.textContent = "نام بعضی دبیرها هنوز مشخص نشده است.";
  content.appendChild(note);
}

function showTeacherDetail(name, subjects) {
  content.replaceChildren();
  addBack(showTeachers);

  const title = document.createElement("h2");
  title.textContent = name;
  content.appendChild(title);

  const text = document.createElement("p");
  text.textContent = "درس‌های مربوط به این دبیر:";
  content.appendChild(text);

  subjects.forEach(subject => {
    content.appendChild(makeButton("📚 " + subject, function() {
      showLessonDetail(subject);
    }));
  });
}

function showLessons() {
  content.replaceChildren();
  addBack(goHome);

  const title = document.createElement("h2");
  title.textContent = "📚 درس‌ها";

  const text = document.createElement("p");
  text.textContent = "برای دیدن نام دبیر، روی درس بزن.";

  content.append(title, text);

  lessons.forEach(lesson => {
    content.appendChild(makeButton("📖 " + lesson.name, function() {
      showLessonDetail(lesson.name);
    }));
  });
}

function showLessonDetail(name) {
  const lesson = lessons.find(item => item.name === name);
  if (!lesson) return;

  content.replaceChildren();
  addBack(showLessons);

  const title = document.createElement("h2");
  title.textContent = "📚 " + lesson.name;

  const detail = document.createElement("div");
  detail.className = "detail";

  const label = document.createElement("p");
  label.textContent = "دبیر این درس:";

  const teacher = document.createElement("strong");
  teacher.textContent = lesson.teacher;

  detail.append(label, teacher);
  content.append(title, detail);
}

function showSchedule() {
  content.replaceChildren();
  addBack(goHome);

  const title = document.createElement("h2");
  title.textContent = "🗓️ برنامه کلاسی";

  const description = document.createElement("p");
  description.textContent = "برنامه هفتگی کلاس‌ها";

  content.append(title, description);

  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const headerRow = document.createElement("tr");

  ["روز", "زنگ اول", "زنگ دوم", "زنگ سوم", "زنگ چهارم"]
    .forEach(label => {
      const th = document.createElement("th");
      th.textContent = label;
      headerRow.appendChild(th);
    });

  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");

  schedule.forEach(day => {
    const row = document.createElement("tr");

    const dayCell = document.createElement("td");
    dayCell.textContent = day.day;
    row.appendChild(dayCell);

    for (let i = 0; i < 4; i++) {
      const cell = document.createElement("td");
      cell.textContent = day.classes[i] || "—";
      row.appendChild(cell);
    }

    tbody.appendChild(row);
  });

  table.appendChild(tbody);
  content.appendChild(table);

  const note = document.createElement("p");
  note.className = "note";
  note.textContent =
    "ساعت زنگ‌ها هنوز ثبت نشده است. دوشنبه، زبان یا شیمی طبق اطلاعات دریافتی درج شده.";

  content.appendChild(note);
}
</script>

</body>
</html>
