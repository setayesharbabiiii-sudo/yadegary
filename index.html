<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دبیرستان یادگاری</title>

<style>
:root {
  --pink: #e9a6c1;
  --ink: #302833;
  --paper: #fffafc;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: var(--paper);
  color: var(--ink);
}
button, input { font-family: inherit; }

header {
  text-align: center;
  padding: 30px 16px;
  background: linear-gradient(135deg,#ffe4ef,#fff9fc);
  border-bottom: 1px solid #f3d5e2;
}
header .flower { font-size: 30px; }
header h1 { margin: 10px 0; font-size: 29px; }
header p { margin: 0; color: #786775; font-size: 13px; }

main {
  width: min(950px, 100%);
  margin: auto;
  padding: 22px 16px 50px;
}
.section-title {
  font-size: 19px;
  margin: 8px 0 18px;
}
.class-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 13px;
}
.class-card {
  border: 1px solid var(--accent);
  border-radius: 19px;
  background: var(--light);
  color: var(--ink);
  min-height: 120px;
  text-align: right;
  padding: 17px 15px;
  cursor: pointer;
  transition: transform .18s, box-shadow .18s;
  box-shadow: 0 5px 15px #3028330a;
}
.class-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 18px #30283312;
}
.class-card .symbol { font-size: 22px; }
.class-card strong { display: block; font-size: 16px; margin: 10px 0 5px; }
.class-card small { color: #70646e; font-size: 11px; }

.math { --accent:#d6a900; --light:#fff8d9; }
.science { --accent:#cf4756; --light:#fff0f1; }
.humanities { --accent:#32815b; --light:#edf8ef; }

#classPage { display: none; }
.back {
  border: 0;
  border-radius: 12px;
  background: #f4e9ef;
  color: #5a3e50;
  padding: 11px 15px;
  cursor: pointer;
  margin-bottom: 18px;
}
.class-hero {
  padding: 23px 18px;
  border-radius: 20px;
  background: var(--light);
  border: 1px solid var(--accent);
  position: relative;
  overflow: hidden;
}
.class-hero h2 { margin: 0 0 8px; font-size: 25px; }
.class-hero p { margin: 0; font-size: 13px; line-height: 1.9; }
.decor {
  position: absolute;
  left: 10px;
  bottom: -12px;
  font-size: 64px;
  opacity: .12;
  pointer-events: none;
}
.info-card {
  background: white;
  border: 1px solid #eee4e9;
  border-radius: 16px;
  padding: 17px;
  margin-top: 15px;
}
.info-card h3 { font-size: 16px; margin: 0 0 13px; }
.info-card p { line-height: 1.9; font-size: 13px; }
.student-lock {
  background: #fff8fb;
  border: 1px dashed #d8a3ba;
  padding: 14px;
  border-radius: 12px;
}
.student-lock p { margin-top: 0; }
.password-row { display: flex; gap: 8px; }
.password-row input {
  width: 100%;
  min-width: 0;
  padding: 12px;
  border: 1px solid #dfcbd5;
  border-radius: 10px;
  background: white;
  font-size: 16px;
}
.password-row button, .action {
  border: 0;
  border-radius: 10px;
  padding: 12px 15px;
  cursor: pointer;
  background: var(--accent);
  color: white;
  white-space: nowrap;
}
.message { font-size: 12px; margin-top: 10px; }
.student-list { line-height: 2.2; padding-right: 20px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { padding: 10px 7px; border: 1px solid #eee1e8; text-align: center; }
th { background: var(--light); }
.table-wrap { overflow-x: auto; }
footer { text-align:center; padding: 20px; color:#8a7884; font-size:11px; }

@media(min-width:650px) {
  .class-grid { grid-template-columns: repeat(4,minmax(0,1fr)); }
  .class-card { min-height: 145px; }
}
</style>
</head>

<body>

<header>
  <div class="flower">🌷 ✦ 🌷</div>
  <h1>دبیرستان یادگاری</h1>
  <p>خانه‌ای برای یادگیری، دوستی و خاطره‌ها</p>
</header>

<main>
  <section id="homePage">
    <h2 class="section-title">کلاس خودت رو انتخاب کن ✨</h2>
    <div class="class-grid" id="classGrid"></div>
  </section>

  <section id="classPage">
    <button class="back" onclick="goHome()">← بازگشت به کلاس‌ها</button>

    <div class="class-hero" id="classHero">
      <div class="decor" id="decor"></div>
      <h2 id="classTitle"></h2>
      <p id="classSubtitle"></p>
    </div>

    <div class="info-card">
      <h3>📚 درس‌ها و دبیران</h3>
      <div id="lessons"></div>
    </div>

    <div class="info-card">
      <h3>🗓️ برنامهٔ هفتگی</h3>
      <div id="schedule"></div>
    </div>

    <div class="info-card">
      <h3>🎓 دانش‌آموزان کلاس</h3>
      <div id="studentArea"></div>
    </div>
  </section>
</main>

<footer>دبیرستان یادگاری · با عشق به آینده 🌸</footer>

<script>
const classes = {
  "10s": {
    name: "دهم تجربی", track: "science", icon: "🧬",
    password: "2222",
    students: [],
    lessons: [],
    schedule: {}
  },
  "11s": {
    name: "یازدهم تجربی", track: "science", icon: "🔬",
    password: "4444",
    students: [], lessons: [], schedule: {}
  },
  "12s": {
    name: "دوازدهم تجربی", track: "science", icon: "🧪",
    password: "6666",
    students: [], lessons: [], schedule: {}
  },
  "10m": {
    name: "دهم ریاضی", track: "math", icon: "📐",
    password: "3333",
    students: [], lessons: [], schedule: {}
  },
  "11m": {
    name: "یازدهم ریاضی", track: "math", icon: "∑",
    password: "5555",
    students: [
      "ستایش", "نازنین", "نیایش", "ناسیه", "فاطمه",
      "حسنی", "هستی", "حوریه", "الیسا", "اندیا"
    ],
    lessons: [
      ["حسابان", "خانم حیدری"],
      ["آمار و احتمال", "خانم حیدری"],
      ["هندسه", "خانم حیدری"],
      ["ادبیات", "خانم نوروزی"],
      ["نگارش", "خانم نوروزی"],
      ["زمین‌شناسی", "خانم یادگارفرد"],
      ["تاریخ", "خانم یادگارفرد"],
      ["انسان و محیط زیست", "خانم یادگارفرد"],
      ["فیزیک", "خانم فاطمی"],
      ["زبان", "نامشخص"],
      ["شیمی", "نامشخص"],
      ["دین و زندگی", "نامشخص"],
      ["کار و هنر", "خانم دهقان"],
      ["عربی", "خانم دهقان"],
      ["ورزش", "نامشخص"]
    ],
    schedule: {
      "شنبه": ["عربی", "شیمی", "دین و زندگی"],
      "یکشنبه": ["فیزیک", "حسابان", "تاریخ", "هندسه"],
      "دوشنبه": ["آمار و احتمال", "زبان یا شیمی", "زمین‌شناسی", "کار و هنر"],
      "سه‌شنبه": ["انسان و محیط زیست", "نگارش", "زبان", "ادبیات"],
      "چهارشنبه": ["ورزش", "فیزیک", "حسابان"]
    }
  },
  "10h": {
    name: "دهم انسانی", track: "humanities", icon: "📖",
    password: "1111",
    students: [], lessons: [], schedule: {}
  },
  "11h": {
    name: "یازدهم انسانی", track: "humanities", icon: "✒️",
    password: "7777",
    students: [], lessons: [], schedule: {}
  },
  "12h": {
    name: "دوازدهم انسانی", track: "humanities", icon: "📚",
    password: "8888",
    students: [], lessons: [], schedule: {}
  }
};

const trackNames = {
  math: "ریاضی‌فیزیک",
  science: "علوم تجربی",
  humanities: "علوم انسانی"
};
const decorations = {
  math: "∑  π  √  x²",
  science: "⚛  🧬  ⚗",
  humanities: "❝  ✒  📖"
};

let currentId = null;
let unlocked = {};

function createClassButtons() {
  const grid = document.getElementById("classGrid");
  grid.innerHTML = "";

  Object.entries(classes).forEach(([id, c]) => {
    const button = document.createElement("button");
    button.className = "class-card " + c.track;
    button.innerHTML = `
      <span class="symbol">${c.icon}</span>
      <strong>${c.name}</strong>
      <small>${trackNames[c.track]} · ورود به کلاس ←</small>
    `;
    button.onclick = () => openClass(id);
    grid.appendChild(button);
  });
}

function openClass(id) {
  currentId = id;
  const c = classes[id];

  document.getElementById("homePage").style.display = "none";
  document.getElementById("classPage").style.display = "block";

  const hero = document.getElementById("classHero");
  hero.className = "class-hero " + c.track;

  document.getElementById("classTitle").textContent = c.name;
  document.getElementById("classSubtitle").textContent =
    trackNames[c.track] + " · فضای اختصاصی کلاس شما";
  document.getElementById("decor").textContent = decorations[c.track];

  showLessons(c);
  showSchedule(c);
  showStudents(c);
  window.scrollTo(0, 0);
}

function showLessons(c) {
  const area = document.getElementById("lessons");

  if (!c.lessons.length) {
    area.innerHTML = "<p>فهرست درس‌ها و نام دبیران این کلاس هنوز ثبت نشده است.</p>";
    return;
  }

  area.innerHTML = `
    <div class="table-wrap">
      <table>
        <tr><th>نام درس</th><th>نام دبیر</th></tr>
        ${c.lessons.map(item =>
          `<tr><td>${escapeHTML(item[0])}</td><td>${escapeHTML(item[1])}</td></tr>`
        ).join("")}
      </table>
    </div>`;
}

function showSchedule(c) {
  const area = document.getElementById("schedule");
  const days = Object.entries(c.schedule);

  if (!days.length) {
    area.innerHTML = "<p>برنامهٔ هفتگی این کلاس هنوز ثبت نشده است.</p>";
    return;
  }

  area.innerHTML = `
    <div class="table-wrap">
      <table>
        <tr><th>روز</th><th>درس‌ها</th></tr>
        ${days.map(([day, lessons]) =>
          `<tr><td>${escapeHTML(day)}</td><td>${lessons.map(escapeHTML).join("، ")}</td></tr>`
        ).join("")}
      </table>
    </div>`;
}

function showStudents(c) {
  const area = document.getElementById("studentArea");

  if (unlocked[currentId]) {
    renderStudents(c);
    return;
  }

  area.innerHTML = `
    <div class="student-lock">
      <p>🔐 برای دیدن اسامی دانش‌آموزان، رمز این کلاس را وارد کن.</p>
      <div class="password-row">
        <input id="classPassword" type="password"
          inputmode="numeric" placeholder="رمز کلاس"
          autocomplete="off" aria-label="رمز کلاس">
        <button onclick="checkPassword()">ورود</button>
      </div>
      <div class="message" id="passwordMessage"></div>
    </div>`;
  document.getElementById("classPassword").addEventListener("keydown", e => {
    if (e.key === "Enter") checkPassword();
  });
}

function checkPassword() {
  const c = classes[currentId];
  const input = document.getElementById("classPassword");
  const message = document.getElementById("passwordMessage");

  if (input.value === c.password) {
    unlocked[currentId] = true;
    renderStudents(c);
  } else {
    message.textContent = "رمز درست نیست؛ دوباره امتحان کن.";
    message.style.color = "#c03945";
    input.value = "";
  }
}

function renderStudents(c) {
  const area = document.getElementById("studentArea");

  if (!c.students.length) {
    area.innerHTML = "<p>فهرست دانش‌آموزان این کلاس هنوز ثبت نشده است.</p>";
    return;
  }

  const list = document.createElement("ol");
  list.className = "student-list";

  c.students.forEach(name => {
    const li = document.createElement("li");
    li.textContent = name;
    list.appendChild(li);
  });

  area.replaceChildren(list);
}

function goHome() {
  document.getElementById("classPage").style.display = "none";
  document.getElementById("homePage").style.display = "block";
  currentId = null;
  window.scrollTo(0, 0);
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[char]);
}

createClassButtons();
</script>
</body>
</html>
